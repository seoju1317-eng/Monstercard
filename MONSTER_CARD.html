const CND=[{n:'🌿⚡ 풀·전기 전용',ty:[2,3]},{n:'🔥 불 속성 전용',ty:[0]},{n:'💧 물 속성 전용',ty:[1]},{n:'🌑✨ 어둠·빛 전용',ty:[4,5]},{n:'🧬 진화체 출현율 ×3',mul:3},{n:'🌟 SR 이상 1장 확정',g:5},{n:'🍀 올 믹스 (보너스 없음)'}];
function spRoul(){$('#sp').innerHTML=`<h3>🎡 속성 룰렛 / 원소 공명</h3><p style="margin:8px 0">룰렛이 오늘의 행운 조건을 정하고, 곧바로 그 조건이 반영된 팩을 열어요.</p><div id="rw" class="rw">?</div><button class="btn" id="rb" ${S.coins<600?'disabled':''} onclick="xro()">룰렛 돌리기 600 🪙</button>`}
function xro(){if(S.coins<600||!room())return;S.coins-=600;S.md.sp++;hdr();const f=CND[Math.random()*CND.length|0],w=$('#rw');$('#rb').setAttribute('disabled','');let d=50;const st=()=>{if(d>420){w.textContent=f.n;w.classList.add('hl');snd([523,784,1047],.1);return setTimeout(()=>{const cs=xspack(f);xadd(cs);reveal(cs,{ret:back})},1100)}w.textContent=CND[Math.random()*CND.length|0].n;snd(300+Math.random()*400,.03,'square',.03);d*=1.13;setTimeout(st,d)};st()}
/* --- 컬렉션: 마스터 셋 / 중복 카운터 / 원트 --- */
const XS=[];for(let j=0;j<3;j++)for(let t=0;t<6;t++)XS.push({id:j*6+t,t,j,ids:[0,1,2,3].map(b=>MONS.filter(m=>m.t==t&&m.bi==b)[j].id)});
const XSR=['프로필 프레임','전용 슬리브(카드 뒷면)','프레임+슬리브+팩 교환권 ×3'];
V.col=()=>{const dx=S.dx||{};let h=`<h2>컬렉션</h2><div class="pan"><h3>🏆 마스터 세트 <small style="opacity:.7">기본 → 1진화 → 2진화 + 전용 서포트(EX) 완성</small></h3><div class="shop" style="margin-top:10px">`;
XS.forEach(s=>{const own=s.ids.filter(i=>dx[i]!=null).length,ok=own==4,cl=S.ms.includes(s.id);h+=`<div class="pan" style="text-align:center"><b style="color:${TY[s.t][1]}">${TY[s.t][0]} 라인 ${s.j+1}</b><div style="font-size:12px;opacity:.8;margin:4px 0">${s.ids.map(i=>`<span style="${dx[i]!=null?'color:#8f8':'opacity:.5'}">${MONS[i].n}</span>`).join(' → ')}</div><small>${XSR[s.j]}</small><br><button class="btn ${cl?'s':''}" style="margin-top:6px" ${ok&&!cl?'':'disabled'} onclick="xsc(${s.id})">${cl?'수령 완료':ok?'보상 받기':own+'/4'}</button></div>`});
h+=`</div><div class="row" style="margin-top:12px"><b>장착</b>${['fr','sk'].map(k=>`<span>${k=='fr'?'프레임':'슬리브'}:</span>${S.un[k].map(t=>`<button class="chip ${S[k]==t?'on':''}" onclick="S.${k}=${t};hdr();go('col')">${TY[t][0]}</button>`).join('')||'<small style="opacity:.6">없음</small>'}<button class="chip" onclick="S.${k}=-1;hdr();go('col')">해제</button>`).join('')}</div></div>
<div class="pan" style="margin-top:14px"><h3>🎯 원트 도전 <small style="opacity:.7">목표 카드를 지정하고 몇 팩 만에 뽑는지 도전!</small></h3><select onchange="xwish(this.value)"><option value="">목표 카드 선택 (SR 이상 몬스터)</option>${MONS.filter(m=>m.id<300&&m.bi>=5).map(m=>`<option value="${m.id}" ${S.wish===m.id?'selected':''}>${RL[m.bi<=10?m.bi:10]} · ${m.n}</option>`).join('')}</select><p style="margin-top:6px">${S.wish!=null?`현재 목표: <b class="gold">${MONS[S.wish].n}</b> · 지금까지 ${S.wtry}팩 소모`:'목표가 없어요.'}</p></div>
<div class="pan" style="margin-top:14px"><h3>📊 누적 획득 카운터</h3><div class="grid" id="cg" style="margin-top:10px"></div></div>`;mn.innerHTML=h;
Object.keys(S.cnt).map(Number).sort((a,b)=>S.cnt[b]-S.cnt[a]).slice(0,30).forEach(m=>{const w=ce('div');w.style.textAlign='center';w.append(cel(m,Math.max(0,dx[m]??0)));w.insertAdjacentHTML('beforeend',`<div style="font-size:12px">누적 <b>${S.cnt[m]}</b>장 ${S.wt[m]?`<span class="bdg">${S.wt[m]==1?'원트 ★':S.wt[m]+'트'}</span>`:''}</div>`);$('#cg').append(w)})};
function xwish(v){S.wish=v===''?null:+v;S.wtry=0;save();go('col')}
function xsc(i){const s=XS[i];if(S.ms.includes(i))return;S.ms.push(i);if(s.j!=1)S.un.fr.push(s.t);if(s.j!=0)S.un.sk.push(s.t);if(s.j==2)S.tk+=3;if(s.j==0){S.fr=s.t}banner('마스터 셋 완성!','#ffd24a');boom(innerWidth/2,innerHeight/2,'#ffd24a',150);save();hdr();go('col')}
/* --- 미션 --- */
const XM=()=>[['d',0,'팩 3개 열기',()=>S.md.p,3,{tk:1}],['d',1,'특수 뽑기 1회',()=>S.md.sp,1,{coins:300}],['d',2,`오늘의 속성(${TY[XT()][0]}) 카드 2장 획득`,()=>S.md.tp[XT()]||0,2,{sh:1}],['w',0,'[주간] 팩 15개 열기',()=>S.mw.p,15,{tk:3}],['w',1,'[주간] SR 이상 카드 3장 획득',()=>S.mw.sr,3,{sh:3}]];
V.ms=()=>{const ic={tk:'🎟 팩 티켓',sh:'💎 확정 조각',coins:'🪙'};mn.innerHTML=`<h2>일일 / 주간 미션</h2><div class="pan row" style="justify-content:space-between"><span>🎟 팩 티켓 <b>${S.tk}</b> · 💎 확정 조각 <b>${S.sh}</b></span><span class="row"><button class="btn" ${S.tk?'':'disabled'} onclick="xtk()">티켓으로 팩 개봉</button><button class="btn r" ${S.sh>=5?'':'disabled'} onclick="xsh()">조각 5개 → AR 이상 확정 팩</button></span></div><div id="ml" style="display:grid;gap:10px;margin-top:12px"></div>`;
XM().forEach((m,i)=>{const o=m[0]=='d'?S.md:S.mw,v=Math.min(m[3](),m[4]),cl=o.cl.includes(m[1]);const d=ce('div','pan');d.innerHTML=`<div class="row" style="justify-content:space-between"><b>${m[2]}</b><span>보상 ${Object.entries(m[5]).map(([k,x])=>ic[k]+' '+x).join(' ')}</span></div><div class="hp" style="margin:8px 0"><i style="width:${v/m[4]*100}%"></i></div><div class="row" style="justify-content:space-between"><small>${v}/${m[4]}</small><button class="btn ${cl?'s':''}" ${v>=m[4]&&!cl?'':'disabled'} onclick="xmc(${i})">${cl?'수령 완료':'받기'}</button></div>`;$('#ml').append(d)})};
function xmc(i){const m=XM()[i],o=m[0]=='d'?S.md:S.mw;if(o.cl.includes(m[1])||m[3]()<m[4])return;o.cl.push(m[1]);for(const k in m[5])S[k==='coins'?'coins':k]+=m[5][k];tt('보상 수령!');snd([523,784,1047],.08);save();hdr();go('ms')}
function xtk(){if(!S.tk||!room())return;S.tk--;BOX=null;const cs=roll(false);save();hdr();reveal(cs,{ret:()=>go('ms')})}
function xsh(){if(S.sh<5||!room())return;S.sh-=5;BOX=null;const cs=roll(true);save();hdr();reveal(cs,{ret:()=>go('ms')})}
const _vh=V.home;V.home=()=>{_vh();const r=ce('div','row');r.style.marginTop='8px';r.innerHTML=`<button class="btn s" ${S.tk?'':'disabled'} onclick="xtk()">🎟 팩 티켓 개봉 (${S.tk})</button><button class="btn s" onclick="go('sp')">🎁 특수 뽑기</button><button class="btn s" onclick="go('nm')">🌃 야시장</button>`;$('.pkw').append(r)};
/* --- 야시장 (발로란트 스타일: 숨겨진 할인율) --- */
function nmGen(){const d=TD();if(S.nm&&S.nm.d==d)return;const r=rng(parseInt(hs(USER+d),36)||7),it=[];for(let i=0;i<6;i++){const ri=3+Math.floor(r()**1.5*9),p=MONS.filter(m=>m.id<300&&(ri<=10?m.bi==ri:m.bi>=7)),m=p[r()*p.length|0];it.push({m:m.id,r:ri,d:[10,10,15,15,20,20,25,30,35,40,50,60][r()*12|0],b:SELL[ri]*3,op:0,bt:0})}S.nm={d,it}}
V.nm=()=>{nmGen();const t=new Date(),e=new Date(t.getFullYear(),t.getMonth(),t.getDate()+1);mn.innerHTML=`<h2 class="nmh">🌃 NIGHT MARKET</h2><p style="margin-bottom:10px">한정 야시장! 6장의 카드에 <b>숨겨진 할인율</b>이 있어요. 상자를 열어 확인하고 구매하세요. 남은 시간 ${Math.floor((e-t)/36e5)}시간 ${Math.floor((e-t)/6e4)%60}분</p><div class="row" style="margin-bottom:12px"><button class="btn s" onclick="S.nm.it.forEach(x=>x.op=1);snd([523,784,1047],.08);go('nm')">전부 열기</button></div><div class="nmg" id="ng"></div>`;
S.nm.it.forEach((x,i)=>{const w=ce('div','nmc'),pr=Math.round(x.b*(1-x.d/100));if(!x.op){w.innerHTML='<div class="nmq">?<small>탭해서 열기</small></div>';w.onclick=()=>{x.op=1;sfx('flip');if(x.d>=40){banner(`-${x.d}% 대박 할인!`,'#ff3c78');boom(innerWidth/2,innerHeight/2,'#ff3c78',60)}save();go('nm')}}else{w.append(cel(x.m,x.r,'100%'));w.insertAdjacentHTML('beforeend',`<div class="nmd">-${x.d}%</div><div><s style="opacity:.6">${fmt(x.b)}</s> <b class="gold">${fmt(pr)}</b>🪙</div><button class="btn" style="margin-top:6px" ${x.bt||S.coins<pr?'disabled':''} onclick="nmB(${i})">${x.bt?'구매 완료':'구매'}</button>`)}$('#ng').append(w)})};
function nmB(i){const x=S.nm.it[i],pr=Math.round(x.b*(1-x.d/100));if(x.bt||S.coins<pr)return;if(S.inv.length+1>cap())return tt('인벤토리가 가득!');S.coins-=pr;x.bt=1;const c={u:S.uid++,m:x.m,r:x.r,g:0,sl:0};S.inv.push(c);(S.dx=S.dx||{})[c.m]=Math.max(S.dx[c.m]??-1,c.r);xreg(c);tt(`${MONS[x.m].n} 구매! -${x.d}%`);snd([523,784,1047],.08);save();hdr();go('nm')}
